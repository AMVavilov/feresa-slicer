name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;28.2.13676358"
          "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, bundle and lint
        run: ./gradlew :app:assembleDebug :app:bundleDebug lintDebug --stacktrace

      - name: Install bundletool
        env:
          BUNDLETOOL_VERSION: "1.18.3"
          BUNDLETOOL_SHA256: "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
        run: |
          bundletool_jar="${RUNNER_TEMP}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "${bundletool_jar}" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          printf '%s  %s\n' "${BUNDLETOOL_SHA256}" "${bundletool_jar}" | sha256sum --check --strict
          printf 'BUNDLETOOL_JAR=%s\n' "${bundletool_jar}" >> "${GITHUB_ENV}"

      - name: Verify 16 KB page-size compatibility
        run: >-
          scripts/verify-16kb-aab.sh
          --aab app/build/outputs/bundle/debug/app-debug.aab
          --apk app/build/outputs/apk/debug/app-debug.apk
